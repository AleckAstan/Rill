schema_version = 1

[[providers]]
id = "aerospace"
kind = "aerospace"
executable = "/opt/homebrew/bin/aerospace"
timeout_ms = 3000
max_output_bytes = 262144

[[modules]]
id = "spaces"
kind = "workspaces"
provider = "aerospace"
placeholder = "AeroSpace…"

[[surfaces]]
id = "main"
kind = "bar"
display = "all"
edge = "top"
start = ["spaces"]
