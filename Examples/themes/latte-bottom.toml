schema_version = 1

[theme]
preset = "segmented"
font = "SF Pro Text"
font_size = 13
foreground = "#4C4F69"
background = "#EFF1F5"
accent = "#8839EF"
module_background = "#E6E9EF"
corner_radius = 18
module_corner_radius = 12
padding = 16
spacing = 10
module_padding = 10
module_vertical_padding = 6
module_min_width = 44
module_min_height = 32
border_color = "#BCC0CC"
border_width = 1

workspace_corner_radius = 10
workspace_padding = 8
workspace_min_height = 32
workspace_spacing = 8
application_icon_size = 14
focused_workspace_background = "#8839EF"
empty_workspace_opacity = 0.7

[[providers]]
id = "omniwm"
kind = "omniwm"
executable = "/Applications/OmniWM.app/Contents/MacOS/omniwmctl"
timeout_ms = 3000
max_output_bytes = 262144

[[surfaces]]
id = "main"
display = "all"
edge = "bottom"
thickness = 48
inset = 12
start = ["apple", "spaces", "finder"]
center = ["frontmost", "separator", "clock"]
end = ["cpu", "memory", "status-separator", "keep-awake", "bluetooth", "wifi", "microphone", "volume", "battery"]

[[modules]]
id = "finder"
kind = "text"
text = "Finder"
icon = "folder"
format = ""
style = { foreground = "#1E66F5" }
on_click = { executable = "/usr/bin/open", args = ["-b", "com.apple.finder"] }

[[modules]]
id = "frontmost"
kind = "frontmostApp"
style = { foreground = "#8839EF" }

[[modules]]
id = "clock"
kind = "clock"
format = "EEE d MMM  HH:mm"
style = { foreground = "#EFF1F5", background = "#8839EF", border_color = "#8839EF" }

[[modules]]
id = "wifi"
kind = "wifi"
format = ""
style = { foreground = "#007E98" }
states.disconnected = { foreground = "#9A6700" }
states.off = { foreground = "#6C6F85" }

[[modules]]
id = "volume"
kind = "volume"
format = "{percent}%"
scroll_volume_step = 5
style = { foreground = "#1E66F5" }
states.muted = { foreground = "#6C6F85" }

[[modules]]
id = "battery"
kind = "battery"
format = "{percent}%"
states.charging = { foreground = "#427B0B" }
states.warning = { foreground = "#9A6700" }
states.critical = { foreground = "#EFF1F5", background = "#D20F39" }

[[modules]]
id = "apple"
kind = "appleMenu"
style = { foreground = "#8839EF" }

[[modules]]
id = "bluetooth"
kind = "bluetooth"
format = ""
style = { foreground = "#8839EF" }
states.error = { foreground = "#D20F39" }
states.connected = { foreground = "#8839EF" }
states.off = { foreground = "#6C6F85" }

[[modules]]
id = "microphone"
kind = "microphone"
format = ""
style = { foreground = "#8839EF" }
states.error = { foreground = "#D20F39" }
states.muted = { foreground = "#6C6F85" }

[[modules]]
id = "keep-awake"
kind = "keepAwake"
format = ""
style = { foreground = "#8839EF" }

[[modules]]
id = "cpu"
kind = "cpu"
format = "{percent}%"
style = { foreground = "#8839EF" }
states.warning = { foreground = "#9A6700" }

[[modules]]
id = "memory"
kind = "memory"
format = "{percent}%"
style = { foreground = "#8839EF" }

[[modules]]
id = "separator"
kind = "separator"

[[modules]]
id = "status-separator"
kind = "separator"

[[modules]]
id = "spaces"
kind = "workspaces"
provider = "omniwm"
placeholder = "OmniWM unavailable"
workspace_variant = "omarchyCircle"
states.active = { foreground = "#8839EF" }
states.occupied = { foreground = "#8839EF" }
states.empty = { foreground = "#6C6F85" }
states.error = { foreground = "#D20F39" }
