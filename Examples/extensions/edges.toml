schema_version = 2

[theme]
preset = "segmented"
font = "SF Pro Text"
font_size = 13
foreground = "#F2F2F7FF"
background = "#17171CDD"
accent = "#89B4FAFF"
corner_radius = 10
padding = 8
spacing = 10
animation_ms = 160

[[extensions]]
id = "dev.rill.sample.rich"
path = "./RichSample"
grant = ["actions", "host.appearance"]

[[modules]]
id = "rich-top"
kind = "extension"
extension = "dev.rill.sample.rich"
contribution = "rich-bar"

[[modules]]
id = "rich-bottom"
kind = "extension"
extension = "dev.rill.sample.rich"
contribution = "rich-bar"

[[modules]]
id = "rich-left"
kind = "extension"
extension = "dev.rill.sample.rich"
contribution = "rich-bar"

[[modules]]
id = "rich-right"
kind = "extension"
extension = "dev.rill.sample.rich"
contribution = "rich-bar"

[[surfaces]]
id = "top"
edge = "top"
top_placement = "belowSystemUI"
start = ["rich-top"]

[[surfaces]]
id = "bottom"
edge = "bottom"
start = ["rich-bottom"]

[[surfaces]]
id = "left"
edge = "left"
start = ["rich-left"]

[[surfaces]]
id = "right"
edge = "right"
start = ["rich-right"]
