schema_version = 1

[theme]
preset = "segmented"
background = "#1E1E2E"
foreground = "#CDD6F4"
module_background = "#313244"

[[surfaces]]
id = "main"
display = "all"
edge = "top"
top_placement = "belowSystemUI"
thickness = 40
start = ["status"]
center = ["clock"]
end = ["cpu", "wifi", "volume", "battery"]

[[providers]]
id = "status"
kind = "event"

[[modules]]
id = "status"
kind = "custom"
provider = "status"
placeholder = "Waiting for status"
style = { padding = 10 }
states.normal = { foreground = "#CDD6F4" }
states.success = { foreground = "#A6E3A1", background = "#203529", border_color = "#A6E3A1", border_width = 1, icon = "checkmark.circle.fill" }
states.warning = { foreground = "#F9E2AF", background = "#463821", border_color = "#F9E2AF", border_width = 2, icon = "exclamationmark.triangle.fill" }
states.error = { foreground = "#F38BA8", background = "#452432", border_color = "#F38BA8", border_width = 2, icon = "xmark.circle.fill" }

[[modules]]
id = "clock"
kind = "clock"
format = "HH:mm"

[[modules]]
id = "cpu"
kind = "cpu"
format = "{percent}%"
icon = "cpu"
states.warning = { foreground = "#FAB387", background = "#463821", border_color = "#FAB387", border_width = 1 }

[[modules]]
id = "wifi"
kind = "wifi"
states.connected = { foreground = "#89B4FA" }
states.disconnected = { foreground = "#F9E2AF", background = "#463821" }
states.off = { foreground = "#A6ADC8" }

[[modules]]
id = "volume"
kind = "volume"
format = "{percent}%"
states.muted = { foreground = "#A6ADC8", icon = "speaker.slash.fill" }

[[modules]]
id = "battery"
kind = "battery"
format = "{percent}%"
states.charging = { foreground = "#A6E3A1", background = "#203529", icon = "battery.100percent.bolt" }
states.full = { foreground = "#A6E3A1" }
states.warning = { foreground = "#F9E2AF" }
states.critical = { foreground = "#F38BA8", background = "#452432", border_color = "#F38BA8", border_width = 2 }
