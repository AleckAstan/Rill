schema_version = 1

[theme]
preset = "segmented"
font = "SF Pro Text"
font_size = 13
foreground = "#F2F2F7FF"
background = "#17171CDD"
accent = "#89B4FAFF"
corner_radius = 10
padding = 8
spacing = 10
animation_ms = 160

[[surfaces]]
id = "main"
kind = "bar"
display = "all"
edge = "top"
top_placement = "menuBarArea"
fullscreen = "hide"
start = ["frontmost"]
center = ["clock"]
end = ["wifi", "status-separator", "volume", "battery"]

[[modules]]
id = "frontmost"
kind = "frontmostApp"

[[modules]]
id = "clock"
kind = "clock"
format = "HH:mm"

[[modules]]
id = "wifi"
kind = "wifi"

[[modules]]
id = "status-separator"
kind = "separator"

[[modules]]
id = "volume"
kind = "volume"

[[modules]]
id = "battery"
kind = "battery"
